name: Tennis — Audit v5 storico completo (sola lettura)

# Rivaluta il modello con lo storico COMPLETO: OLD (congelato), NEW e mercato sulle stesse partite, per categoria/superficie/fasce, con bootstrap a blocchi e Holm;
# validazione delle classi A/B/C/D e controllo di indipendenza per le doppie. SOLA LETTURA: nessuna scrittura, nessun provider, nessun effetto sul motore.
# Solo avvio manuale. Report nel riepilogo dell'esecuzione e nell'artifact.
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit v5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/tennis-strategy-audit-v5.js
      - uses: actions/upload-artifact@v4
        with:
          name: tennis-strategy-audit-v5
          path: audit-out/
