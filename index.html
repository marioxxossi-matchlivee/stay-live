<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1a2b" />
    <meta name="description" content="Stay Live: probabilità, BET o EVITA e preview di giornata per i principali campionati, Champions ed Europa League." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Stay Live — Analisi partite</title>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/">Stay<span>Live</span></a>
      <div class="top-actions">
        <button class="ghost" id="open-method" type="button">Come calcoliamo</button>
        <button class="ghost" id="refresh" type="button" aria-label="Aggiorna dati">Aggiorna</button>
      </div>
    </header>
    <main>
      <section class="intro">
        <h1 id="day-title">Partite</h1>
        <p id="summary" class="summary" aria-live="polite">Caricamento…</p>
      </section>
      <div id="banner" class="banner" role="status" hidden></div>
      <div class="leaguebar">
        <button class="ghost lg-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="league-nav"></button>
      </div>
      <nav class="league-nav" id="league-nav" aria-label="Campionati per nazione" hidden></nav>
      <div class="days" id="day-strip" aria-label="Giornata"></div>
      <div class="toolbar">
        <label class="switch"><input type="checkbox" id="only-bet" /><span>Solo BET</span></label>
        <button class="ghost" id="select-day" type="button">Seleziona tutte</button>
        <button class="ghost" id="select-bets" type="button">Seleziona i BET</button>
        <label class="hist">Storico
          <select id="history-count"><option value="5">5 gare</option><option value="8" selected>8 gare</option><option value="10">10 gare</option></select>
        </label>
      </div>
      <div id="list" class="list"></div>
      <p class="foot">Stime statistiche sperimentali basate solo sui gol. Non sono garanzie né consigli finanziari.</p>
    </main>

    <div class="selbar" id="selbar" hidden>
      <span id="sel-count">0 partite</span>
      <button class="ghost" id="sel-clear" type="button">Svuota</button>
      <button class="primary" id="make-preview" type="button">Genera preview</button>
    </div>

    <dialog id="detail" aria-label="Dettaglio partita"><button class="close" data-close aria-label="Chiudi">×</button><div id="detail-body"></div></dialog>
    <dialog id="preview" aria-label="Preview giornata"><button class="close" data-close aria-label="Chiudi">×</button><div id="preview-body"></div></dialog>
    <dialog id="method" aria-label="Come calcoliamo"><button class="close" data-close aria-label="Chiudi">×</button><div id="method-body"></div></dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
