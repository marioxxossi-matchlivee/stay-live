name: Registra i pronostici

# Ogni 4 ore registra su Supabase il pronostico principale di tutte le partite in programma nelle prossime 36 ore (anche quelle mai aperte nell'app),
# usando solo i dati già in cache (nessuna richiesta in più ad API-Football). La riga si congela al calcio d'inizio.
# Usa gli stessi secrets di "Aggiorna campionati": SITE_URL e SYNC_SECRET.
# NON più programmato: il registro dei pronostici è una fase di "Aggiornamento completo" (ogni 4 ore). Resta avviabile a mano da GitHub.
on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Registra i pronostici
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "${SITE_URL:-}" ] || [ -z "${SYNC_SECRET:-}" ]; then echo "Mancano i secrets SITE_URL e SYNC_SECRET"; exit 1; fi
          for attempt in 1 2 3; do
            body=$(curl -sS -m 120 -H "x-sync-secret: $SYNC_SECRET" "$SITE_URL/api/snapshot?hours=36" || true)
            if echo "$body" | jq -e '.ok == true' >/dev/null 2>&1; then echo "$body" | jq -c .; exit 0; fi
            echo "… tentativo $attempt: $(echo "$body" | head -c 200)"; sleep $((20 * attempt))
          done
          exit 1
