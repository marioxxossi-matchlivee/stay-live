name: Tennis — Monitoraggio storico (sola lettura)

# Controllo periodico della completezza dello storico partite (paginazione a chiave). SOLA LETTURA: nessuna scrittura, nessun provider,
# nessun effetto sul motore. Esito INCOMPLETO = il workflow fallisce; ATTENZIONE = avviso (annotazione gialla). Report nel riepilogo e nell'artifact.
on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Monitoraggio storico
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/tennis-history-monitor.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-history-monitor
          path: audit-out/
