name: Aggiornamento completo

# Ogni 4 ore (00:10, 04:10, 08:10, 12:10, 16:10, 20:10 UTC) aggiorna TUTTO con API-Football (unico provider): campionati e risultati,
# pronostici, quote Over/Under e 1X2, quote corner, schede dati delle partite nelle prossime 48 ore, corner storici reali per il modello,
# registro dei pronostici; poi salva l'istantanea che l'app legge (tabella app_snapshot) e la rilegge per verificarla.
# Le operazioni rimaste incomplete le riprende "Recupero aggiornamento" (ogni 30 minuti), senza aspettare il giro successivo.
# Si avvia anche a mano: da GitHub (Actions → Run workflow) o dall'app (Impostazioni → Stato dei dati → "Aggiorna tutto ora").
#
# Secrets del repository (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, API_FOOTBALL_KEY      (SYNC_SECRET è facoltativo)
#   API_NINJAS_KEY non serve più: si può eliminare.
on:
  schedule:
    - cron: "10 */4 * * *"
  workflow_dispatch:

# Stesso gruppo del recupero: i due non girano mai insieme (niente richieste doppie né crediti sprecati).
concurrency:
  group: aggiornamento-stay-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aggiornamento completo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          FIXTURES_DAYS: "7"
          REFRESH_MODE: full
        run: node scripts/full-refresh.js
