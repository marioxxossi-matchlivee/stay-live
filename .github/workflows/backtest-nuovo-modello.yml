name: Backtest nuovo modello calcio

# Backtest walk-forward OLD vs NEW sullo storico delle partite finali (SOLA LETTURA: nessuna scrittura su Supabase, nessuna chiamata a API-Football).
# Si avvia a mano. Produce come artefatto: report.md (confronto, calibrazione, campioni, stati), results.json e _newmodel-params.generated.js
# (da copiare in functions/api/_newmodel-params.js solo dopo aver letto il report). Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backtest walk-forward
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backtest-new-model.js --source supabase --out backtest-new-model > backtest-new-model.log && cp backtest-new-model/report.md "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-nuovo-modello
          path: backtest-new-model/
          if-no-files-found: error
          retention-days: 30
